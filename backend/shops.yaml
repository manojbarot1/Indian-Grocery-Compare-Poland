      source: https://asiadeli.pl
      last_verified: "2026-09-18"
      note: "Rates quoted at checkout. Band prices are ESTIMATES."
      free_over: null
      handling_days: [1, 2]
      methods:
        - name: Kurier / Paczkomat
          transit_days: [1, 3]
          estimated: true
          bands: [{ max_kg: 25.0, price: 15.99 }]

  - slug: littleasiagrocery
    name: Little Asia Grocery
    url: https://littleasiagrocery.pl
    platform: woocommerce
    country: PL
    currency: PLN
    ships_to: [PL]
    active: true
    weight_unit: kg
    ingest:
      path: /wp-json/wc/store/v1/products
      page_size: 100
      max_pages: 40
    shipping:
      confidence: low
      source: https://littleasiagrocery.pl
      last_verified: "2026-09-18"
      note: "Rates quoted at checkout. Band prices are ESTIMATES."
      free_over: null
      handling_days: [1, 2]
      methods:
        - name: Kurier / Paczkomat
          transit_days: [1, 3]
          estimated: true
          bands: [{ max_kg: 25.0, price: 15.99 }]

  - slug: indiadabazaar
    name: India Da Bazaar
    url: https://indiadabazaar.pl
    platform: woocommerce
    country: PL
    currency: PLN
    ships_to: [PL]
    active: true
    weight_unit: kg
    ingest:
      path: /wp-json/wc/store/v1/products
      page_size: 100
      max_pages: 20
      # Their security plugin serves an HTML block page to any UA containing
      # "bot", so the default DesiPriceBot string gets no JSON at all. This UA
      # still identifies the crawler and gives a contact point; it just avoids
      # the substring the filter keys on. robots.txt permits this endpoint.
      user_agent: "DesiPrice/0.1 (+https://desiprice.pl; price comparison; contact: hello@desiprice.pl)"
    shipping:
      confidence: low
      source: https://indiadabazaar.pl
      last_verified: "2026-09-18"
      note: "Rates quoted at checkout. Band prices are ESTIMATES."
      free_over: null
      handling_days: [1, 2]
      methods:
        - name: Kurier / Paczkomat
          transit_days: [1, 3]
          estimated: true
          bands: [{ max_kg: 25.0, price: 15.99 }]

  - slug: asianshop
    name: AsianShop
    url: https://asianshop.pl
    platform: html
    country: PL
    currency: PLN
    ships_to: [PL]
    active: true
    ingest:
      # Shoper: no sitemap at all, so products are discovered by walking the
      # category tree. Product data comes from schema.org JSON-LD, which this
      # platform splits across a dozen fragments sharing one @id.
      discovery: categories
      category_pattern: "/pl/c/"
      product_pattern: "/pl/p/"
      page_param: "page"
      max_pages_per_category: 30
      max_products: 3000
      include_pattern: "/pl/p/"
      selectors:
        title: ["h1", "title"]
        price: [".price", ".product-price"]
        image: ["img[src*='/userdata/public/gfx']"]
    shipping:
      # The only shop besides India Bazaar that publishes machine-readable
      # rates — they are embedded in the product page's JSON-LD.
      confidence: high
      source: https://asianshop.pl/pl/p/Przyprawa-Kitchen-King-MDH-100-g/481
      last_verified: "2026-09-18"
      free_over: 50.00
      handling_days: [0, 0]
      methods:
        - name: DPD Pickup
          transit_days: [2, 2]
          bands: [{ max_kg: 30.0, price: 7.00 }]
        - name: DPD Kurier
          transit_days: [2, 2]
          bands: [{ max_kg: 30.0, price: 8.50 }]
        - name: DHL Box 24/7
          transit_days: [2, 2]
          bands: [{ max_kg: 30.0, price: 9.00 }]
        - name: DHL Kurier
          transit_days: [2, 2]
          bands: [{ max_kg: 30.0, price: 10.50 }]
        - name: InPost Paczkomaty 24/7
          transit_days: [2, 2]
          bands: [{ max_kg: 25.0, price: 11.00 }]
        - name: InPost Kurier
          transit_days: [2, 2]
          bands: [{ max_kg: 30.0, price: 13.00 }]

  - slug: littleindia
    name: Little India
    url: https://www.littleindia.pl
    platform: html
    country: PL
    currency: PLN
    ships_to: [PL]
    active: true
    ingest:
      # SOTESHOP. Its sitemap exists but is stale — every product URL in it
      # 404s — so discovery walks the category tree instead, which is live.
      discovery: categories
      category_pattern: "/category/"
      product_pattern: "\\.html$"
      page_param: "page"
      # SOTESHOP renders a whole category on one page — ?page=2 returns the same
      # products — so the crawler only needs one request per category to see
      # everything, plus one to confirm there is no more. 25 was pointless.
      max_pages_per_category: 2
      # Raised after the first full run returned exactly 2499 — the old 2500
      # cap was binding, so the catalogue is larger than it.
      max_products: 6000
      include_pattern: "\\.html$"
      exclude_patterns: ["/webpage/", "/category/", "/lang/", "/manufacturer/", "/group/"]
      selectors:
        title: ["h1"]
        # Gross price is what the shopper pays; the page also shows a net price
        # and a struck-through old price, neither of which we want.
        price: ["#st_product_options-price-brutto"]
        image: ["meta[property='og:image']"]
    shipping:
      confidence: low
      source: https://www.littleindia.pl
      last_verified: "2026-09-18"
      note: "Rates quoted at checkout. Band prices are ESTIMATES."
      free_over: null
      handling_days: [1, 2]
      methods:
        - name: Kurier / Paczkomat
          transit_days: [1, 3]
          estimated: true
          bands: [{ max_kg: 25.0, price: 15.99 }]

